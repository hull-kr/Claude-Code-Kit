<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <rect width="920" height="480" fill="#16161e"/>
  <rect width="920" height="30" fill="#12121a"/>
  <circle cx="16" cy="15" r="6" fill="#7c6ce0"/>
  <text x="30" y="20" fill="#e6e6ee" font-size="12">Claude Code Kit · 설정</text>

  <!-- sidebar -->
  <rect x="0" y="30" width="200" height="450" fill="#14141c"/>
  <text x="24" y="66" fill="#e6e6ee" font-size="17" font-weight="bold">Claude Code Kit</text>
  <text x="28" y="112" fill="#8a8a9a" font-size="14">★ 관리 세션</text>
  <text x="28" y="152" fill="#8a8a9a" font-size="14">● 열린 세션</text>
  <text x="28" y="192" fill="#8a8a9a" font-size="14">○ 닫힌 세션</text>
  <text x="28" y="232" fill="#8a8a9a" font-size="14">▦ 모든 세션</text>
  <rect x="0" y="264" width="200" height="40" fill="#7c6ce0"/>
  <text x="28" y="289" fill="#fff" font-size="14">⚙ 설정</text>
  <text x="28" y="330" fill="#8a8a9a" font-size="14">? 사용 설명서</text>

  <!-- settings content -->
  <g fill="#e6e6ee">
    <text x="230" y="72" font-size="16" font-weight="bold">⚙ 설정</text>

    <text x="230" y="118" font-size="13" fill="#9a9ab0">언어 / Language</text>
    <rect x="230" y="128" width="200" height="30" fill="#24242e" stroke="#3a3a48"/>
    <text x="242" y="148" font-size="13">한국어</text>
    <text x="418" y="148" fill="#8a8a9a" font-size="12">▾</text>

    <text x="230" y="192" font-size="13" fill="#9a9ab0">이미지 붙여넣기</text>
    <rect x="230" y="202" width="16" height="16" rx="3" fill="#7c6ce0"/><path d="M234 210 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="254" y="215" font-size="13">미리보기 표시 (5초)</text>
    <text x="230" y="242" font-size="12" fill="#8a8a9a">단축키: Ctrl + Shift + V</text>

    <text x="230" y="286" font-size="13" fill="#9a9ab0">WT 창 방식</text>
    <rect x="230" y="296" width="16" height="16" rx="3" fill="#7c6ce0"/><path d="M234 304 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="254" y="309" font-size="13">한 창에 탭으로 열기</text>

    <text x="230" y="352" font-size="13" fill="#9a9ab0">세션 복원 / 리모트</text>
    <rect x="230" y="362" width="16" height="16" rx="3" fill="#7c6ce0"/><path d="M234 370 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="254" y="375" font-size="13">로그인 시 자동 복원</text>
    <rect x="230" y="392" width="16" height="16" rx="3" fill="#7c6ce0"/><path d="M234 400 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="254" y="405" font-size="13">PC 절전 방지 (원격 끊김 방지)</text>
    <text x="230" y="438" font-size="13">리모트 유휴 유지:</text>
    <rect x="360" y="422" width="70" height="26" fill="#24242e" stroke="#3a3a48"/>
    <text x="372" y="440" font-size="13">120</text>
    <text x="440" y="438" font-size="13" fill="#8a8a9a">분</text>
  </g>
