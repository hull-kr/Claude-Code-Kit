<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <!-- desktop-ish bg -->
  <rect width="420" height="320" fill="#0b3b6f"/>
  <rect width="420" height="320" fill="url(#g)"/>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e5aa8" stop-opacity="0.5"/><stop offset="1" stop-color="#0b3b6f" stop-opacity="0"/></linearGradient></defs>

  <!-- taskbar -->
  <rect x="0" y="286" width="420" height="34" fill="#1a1a24" opacity="0.95"/>
  <circle cx="360" cy="303" r="8" fill="#7c6ce0"/>
  <text x="386" y="308" fill="#cfcfe0" font-size="12">15:30</text>

  <!-- context menu -->
  <rect x="150" y="70" width="230" height="206" rx="8" fill="#1e1e2a" stroke="#3a3a48"/>
  <g font-size="14" fill="#e6e6ee">
    <text x="170" y="98" font-weight="bold">컨트롤 패널 열기</text>
    <line x1="162" y1="114" x2="368" y2="114" stroke="#3a3a48"/>
    <text x="170" y="140">이어서 열기 <tspan fill="#8a8a9a">▸</tspan></text>
    <text x="170" y="168">리모트 <tspan fill="#8a8a9a">▸</tspan></text>
    <line x1="162" y1="184" x2="368" y2="184" stroke="#3a3a48"/>
    <text x="170" y="210">설치 폴더 열기</text>
    <text x="170" y="238">데몬 다시 시작</text>
    <text x="170" y="266" fill="#e08a8a">종료</text>
  </g>
  <!-- pointer to tray -->
  <path d="M360 295 L330 250 L360 258 Z" fill="#7c6ce0" opacity="0.4"/>
</svg>
