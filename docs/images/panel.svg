    <text x="588" y="24" class="cell" text-anchor="middle">D:\…</text>
    <text x="650" y="24" class="cell" text-anchor="middle">포그라운드</text>
    <text x="716" y="24" class="cell" text-anchor="middle">07-24 14:41</text>
