    <text x="792" y="24" text-anchor="middle" fill="#fff" font-size="12">● 켜짐</text>
    <rect x="828" y="8" width="48" height="24" rx="7" fill="#c85656"/>
    <text x="852" y="24" text-anchor="middle" fill="#fff" font-size="12">닫기</text>
    <rect x="874" y="8" width="60" height="24" rx="7" fill="#424256"/>
    <text x="904" y="24" text-anchor="middle" fill="#fff" font-size="12">bg 전환</text>
