    <text x="440" y="24" class="sub" text-anchor="middle" font-size="13">[이름없음] AICA</text>
    <text x="588" y="24" class="sub" text-anchor="middle" font-size="13">D:\…</text>
    <text x="650" y="24" class="sub" text-anchor="middle" font-size="13">닫힘</text>
